   

  
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Slider Gallery</title>
    <style>
        body {
            margin: 0;
            background-color: #e5e5e5;
            font-family: Arial, sans-serif;
        }
        main {
            width: min(1200px, 95vw);
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        .slider-container {
            margin: 3rem 0;
        }
        
        .slider {
            width: 100%;
            height: var(--height);
            overflow: hidden;
            position: relative;
            mask-image: linear-gradient(
                to right,
                transparent,
                #000 10% 90%,
                transparent
            );
            -webkit-mask-image: linear-gradient(
                to right,
                transparent,
                #000 10% 90%,
                transparent
            );
        }
        .slider .list {
            display: flex;
            width: 100%;
            min-width: calc(var(--width) * var(--quantity));
            position: relative;
            height: 100%;
        }
        .slider .list .item {
            width: var(--width);
            height: var(--height);
            position: absolute;
            left: 100%;
            animation: autoRun 20s linear infinite;
            transition: filter 0.5s;
            animation-delay: calc( (20s / var(--quantity)) * (var(--position) - 1) - 20s)!important;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .slider .list .item img {
            width: 90%;
            height: 90%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        
        @keyframes autoRun {
            from {
                left: 100%;
            }
            to {
                left: calc(var(--width) * -1);
            }
        }
        
        .slider:hover .item {
            animation-play-state: paused!important;
            filter: grayscale(1);
        }
        .slider .item:hover {
            filter: grayscale(0);
            z-index: 10;
        }
        .slider .item:hover img {
            transform: scale(1.05);
        }
        
        .slider[reverse="true"] .item {
            animation: reversePlay 20s linear infinite;
        }
        
        @keyframes reversePlay {
            from {
                left: calc(var(--width) * -1);
            }
            to {
                left: 100%;
            }
        }
        
        /* Responsive adjustments */
        @media (max-width: 992px) {
            .slider {
                mask-image: linear-gradient(
                    to right,
                    transparent,
                    #000 5% 95%,
                    transparent
                );
                -webkit-mask-image: linear-gradient(
                    to right,
                    transparent,
                    #000 5% 95%,
                    transparent
                );
            }
        }
        
        @media (max-width: 768px) {
            main {
                width: 100%;
                padding: 0 0.5rem;
            }
            
            .slider {
                --width: 150px !important;
                --height: 150px !important;
            }
            
            .slider .list .item img {
                width: 85%;
                height: 85%;
            }
        }
        
        @media (max-width: 576px) {
            .slider {
                --width: 120px !important;
                --height: 120px !important;
                mask-image: linear-gradient(
                    to right,
                    transparent,
                    #000 2% 98%,
                    transparent
                );
                -webkit-mask-image: linear-gradient(
                    to right,
                    transparent,
                    #000 2% 98%,
                    transparent
                );
            }
            
            .slider .list .item {
                animation-duration: 15s !important;
            }
            
            .slider[reverse="true"] .item {
                animation-duration: 15s !important;
            }
        }
        
        /* Section titles */
        .section-title {
            text-align: center;
            margin: 2rem 0 1rem;
            color: #333;
            font-size: 1.8rem;
        }
    </style>
</head>
<body>
    {% include 'base.html' %}
    <main>
        
        <h2 class="section-title">Our Clients</h2>
        <div class="slider-container">
            <div class="slider" style="
                --width: 180px;
                --height: 100px;
                --quantity: 10;
            ">
                <div class="list">
                    <div class="item" style="--position: 1"><img src="static/images/slider1_1.png" alt="Client logo 1"></div>
                    <div class="item" style="--position: 2"><img src="static/images/slider1_2.png" alt="Client logo 2"></div>
                    <div class="item" style="--position: 3"><img src="static/images/slider1_3.png" alt="Client logo 3"></div>
                    <div class="item" style="--position: 4"><img src="static/images/slider1_4.png" alt="Client logo 4"></div>
                    <div class="item" style="--position: 5"><img src="static/images/slider1_5.png" alt="Client logo 5"></div>
                    <div class="item" style="--position: 6"><img src="static/images/slider1_6.png" alt="Client logo 6"></div>
                    <div class="item" style="--position: 7"><img src="static/images/slider1_7.png" alt="Client logo 7"></div>
                    <div class="item" style="--position: 8"><img src="static/images/slider1_8.png" alt="Client logo 8"></div>
                    <div class="item" style="--position: 9"><img src="static/images/slider1_9.png" alt="Client logo 9"></div>
                    <div class="item" style="--position: 10"><img src="static/images/slider1_10.png" alt="Client logo 10"></div>
                </div>
            </div>
        </div>

        <h2 class="section-title">Our Projects</h2>
        <div class="slider-container">
            <div class="slider" reverse="true" style="
                --width: 250px;
                --height: 250px;
                --quantity: 9;
            ">
                <div class="list">
                    <div class="item" style="--position: 1"><img src="static/images/slider2_1.png" alt="Project 1"></div>
                    <div class="item" style="--position: 2"><img src="static/images/slider2_2.png" alt="Project 2"></div>
                    <div class="item" style="--position: 3"><img src="static/images/slider2_3.png" alt="Project 3"></div>
                    <div class="item" style="--position: 4"><img src="static/images/slider2_4.png" alt="Project 4"></div>
                    <div class="item" style="--position: 5"><img src="static/images/slider2_5.png" alt="Project 5"></div>
                    <div class="item" style="--position: 6"><img src="static/images/slider2_6.png" alt="Project 6"></div>
                    <div class="item" style="--position: 7"><img src="static/images/slider2_7.png" alt="Project 7"></div>
                    <div class="item" style="--position: 8"><img src="static/images/slider2_8.png" alt="Project 8"></div>
                    <div class="item" style="--position: 9"><img src="static/images/slider2_9.png" alt="Project 9"></div>
                </div>

    </main>
    {% include 'base2.html' %}
   
   
</body>
</html>
