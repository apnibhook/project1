<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Bootstrap Div</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Full screen styling */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        
        .full-screen {
            min-height: 100vh;
            width: 100%;
        }
    </style>
</head>
<body>
    <!-- Full-screen container -->
    <div class="full-screen container-fluid d-flex flex-column" style="border: 1px solid black;">
                                                                            <!-- Yeh left to right kay leay ha  -->
        <div class ="d-flex flex-row" style="border: 1px solid black;">   
                                                                        <!-- Yeh class="fs-1"  to class="fs-6" tak hai rem for responsive screen kay leay hota ha-->
        <div style="border: 1px solid black;"><p class="fs-1">Shazil</p></div>
        <div style="border: 1px solid black;">Shazi2</div>
     </div>
                                                                                     <!-- Yeh Up to Down kay leay ha  -->
     <div class ="d-flex flex-column" style="border: 1px solid black;">
        <div>About US</div>
        <div>Our Services</div>
        <div>Trades</div>
        <div>Our Projects</div>
        <div>Blogs</div>
        <div> Contact Us</div>
</div>
    </div>

<!-- Margin Syntax
The pattern is: {property}{sides}-{size}

Where:

property: m (margin) or p (padding)

sides:

x (left & right)

s/e (start/end)

l/r/t/b (left/right/top/bottom - legacy)

size:

0 (0rem/0px)

1 (0.25rem/4px)

2 (0.5rem/8px)

3 (1rem/16px)

4 (1.5rem/24px)

5 (3rem/48px)

auto (auto margin)

<div class="ml-2 mr-3">Margin left 0.5rem, margin right 1rem</div>

6. Negative Margins:


<div class="mx-n2">Negative margin left and right</div>
<div class="ms-n1 me-n3">Different negative margins</div>



-->




    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
   
</body>
</html>
